<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Commerce Bridge{% endblock %}</title>
<style>
  :root {
    --accent: #635bff;
    --accent-dark: #4b42e0;
    --border: #e3e3e8;
    --bg-soft: #f7f7fa;
    --text: #1a1a1a;
    --text-muted: #666;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    color: var(--text);
    background: #fff;
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .brand h1 { font-size: 17px; margin: 0; }
  .brand .tag { font-size: 12px; color: var(--text-muted); }
  nav { display: flex; align-items: center; gap: 14px; }
  nav a, nav select {
    font-size: 13px; color: var(--text-muted); text-decoration: none;
  }
  nav a:hover { color: var(--text); }
  nav select {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: white;
  }

  section { margin-bottom: 36px; }
  section > h2 { font-size: 15px; margin: 0 0 4px; }
  section > p.desc { font-size: 13px; color: var(--text-muted); margin: 0 0 16px; }

  .card { border: 1px solid var(--border); border-radius: 10px; padding: 20px; max-width: 420px; }
  label { font-size: 13px; color: var(--text-muted); display: block; margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="email"], input[type="password"], input[type="number"], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 12px 0; }
  .checkbox-row input { width: auto; }

  button, .btn {
    background: var(--accent); color: white; border: none;
    padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 13.5px;
  }
  button:hover, .btn:hover { background: var(--accent-dark); }
  button.secondary { background: #eee; color: var(--text); }
  button.approve { background: #0a7a2f; }
  button.approve:hover { background: #086024; }
  button.reject { background: #a30000; }
  button.reject:hover { background: #820000; }

  .error { color: #b00020; font-size: 13px; margin-top: 8px; }
  .helper-link { font-size: 13px; color: var(--text-muted); margin-top: 12px; }

  .catalog { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .catalog-item {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .catalog-item .row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .catalog-item h3 { font-size: 14px; margin: 0; }
  .catalog-item .price { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .catalog-item .desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; min-height: 32px; }

  .toggles { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--border); }
  .toggles form { display: inline; }
  button.toggle {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    padding: 4px 10px; border-radius: 14px; font-size: 11.5px; cursor: pointer;
  }
  button.toggle.on { background: #e6f4ea; border-color: #b7e2c3; color: #0a7a2f; }
  button.toggle.off-state { background: #fbe6e6; border-color: #f0b8b8; color: #a30000; }

  .test-buttons { display: flex; gap: 12px; margin-bottom: 6px; }
  #test-result { font-size: 13px; }

  .orders-list { display: flex; flex-direction: column; gap: 10px; }
  .order-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .order-card .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .order-card .head-left { display: flex; align-items: center; gap: 10px; }
  .status-pill { font-size: 11px; padding: 2px 10px; border-radius: 12px; white-space: nowrap; }
  .status-pill.pending_approval { background: #fff4e0; color: #8a5a00; }
  .status-pill.approved { background: #e6f4ea; color: #0a7a2f; }
  .status-pill.rejected { background: #fbe6e6; color: #a30000; }
  .order-card .meta { font-size: 12.5px; color: var(--text-muted); margin: 8px 0; }
  .order-actions { display: flex; gap: 8px; margin-top: 8px; }
  .order-actions form { display: inline; }
  .shipment-form { display: flex; gap: 8px; margin-top: 8px; }
  .shipment-form input { flex: 1; }

  .empty-note { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">🏪</div>
      <div>
        <h1>{% block store_name %}Commerce Bridge{% endblock %}</h1>
        <div class="tag">{% block subtitle %}Vendor Portal{% endblock %}</div>
      </div>
    </div>
    {% block nav %}{% endblock %}
  </header>

  {% block content %}{% endblock %}
</body>
</html>
