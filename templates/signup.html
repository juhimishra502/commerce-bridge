{% extends "base.html" %}
{% block title %}Sign up — Commerce Bridge{% endblock %}
{% block content %}
<section>
  <h2>Create your vendor account</h2>
  <p class="desc">Sign up to manage one or more stores and sell through agent checkout channels.</p>
  <form method="post" class="card">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required minlength="8">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div style="margin-top:16px;">
      <button type="submit">Sign up</button>
    </div>
  </form>
  <p class="helper-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
